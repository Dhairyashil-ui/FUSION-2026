<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pune Earth Observation - Google 2D Map</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      height: 64px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #c4b5fd, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-stac {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-stac .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 8px #8b5cf6;
    }

    /* Layout Main */
    .app-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Map View */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #e5e3df;
      z-index: 1;
    }

    /* Floating Overlay Sidebar */
    .sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      max-height: calc(100% - 32px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 999;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-optical {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-optical:hover { box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5); transform: translateY(-1px); }

    .btn-radar {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }
    .btn-radar:hover { box-shadow: 0 6px 16px rgba(244, 63, 94, 0.5); transform: translateY(-1px); }

    .btn-elevation {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
    }
    .btn-elevation:hover { box-shadow: 0 6px 16px rgba(234, 179, 8, 0.5); transform: translateY(-1px); }

    .btn-clear {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-clear:hover { background: rgba(51, 65, 85, 0.9); }

    /* Status Loader */
    .status-panel {
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 4px;
    }

    .status-panel.hidden {
      display: none;
    }

    .status-panel.loading {
      color: #60a5fa;
      border-color: rgba(66, 133, 244, 0.3);
    }

    .status-panel.success {
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.3);
    }

    .status-panel.error {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(66, 133, 244, 0.3);
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Map Layer Control Style */
    .leaflet-control-layers {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      color: #f8fafc !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
      padding: 8px 12px !important;
      font-family: inherit;
    }

    /* Popup Styling */
    .custom-popup .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .custom-popup .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.95);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="satellite"></i>
      </div>
      <div>
        <div class="brand-title">Pune Earth Observation</div>
        <div class="brand-subtitle">Satellite Imagery & Elevation Footprints</div>
      </div>
    </div>

    <div class="header-actions">
      <div class="badge-stac">
        <div class="dot"></div>
        <span>Earth Search / ASF STAC APIs</span>
      </div>
    </div>
  </header>

  <!-- App Main Container -->
  <div class="app-container">

    <!-- Floating Sidebar Panel -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <i data-lucide="layers"></i>
          <span>Asset Discovery</span>
        </div>
      </div>

      <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.5;">
        Discover and visualize spatial footprints for EO imagery and elevation data in Pune.
      </p>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
        <button id="btn-optical" class="btn-action btn-optical">
          <i data-lucide="image"></i>
          <span>Optical Imagery (Sentinel-2)</span>
        </button>

        <button id="btn-radar" class="btn-action btn-radar">
          <i data-lucide="radio"></i>
          <span>Radar / SAR (Sentinel-1)</span>
        </button>

        <button id="btn-elevation" class="btn-action btn-elevation">
          <i data-lucide="mountain"></i>
          <span>Elevation 3D (COP30 DEM)</span>
        </button>
      </div>

      <!-- Status Indicator -->
      <div id="status-panel" class="status-panel hidden">
        <div class="spinner"></div>
        <span id="status-text">Ready...</span>
      </div>

      <button id="btn-clear" class="btn-action btn-clear" style="margin-top: 12px;">
        <i data-lucide="trash-2"></i>
        <span>Clear Map</span>
      </button>
    </div>

    <!-- Map View Element -->
    <div id="map"></div>
  </div>

  <!-- JavaScript logic -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Map & Layer State Variables
    let map = null;
    let footprintsLayer = L.featureGroup();

    // GOOGLE MAPS TILE LAYERS (Real Google 2D Map)
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map', {
        center: [18.5204, 73.8567], // Pune center coordinates
        zoom: 11,
        layers: [googleHybrid],
        zoomControl: false
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      const baseMaps = {
        "Google Hybrid (Satellite)": googleHybrid,
        "Google 2D Map (Roadmap)": googleRoadmap,
        "Google Satellite": googleSatellite
      };
      L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

      footprintsLayer.addTo(map);
    }

    function setStatus(type, message) {
      const statusPanel = document.getElementById('status-panel');
      statusPanel.classList.remove('hidden');
      statusPanel.className = `status-panel ${type}`;
      
      if (type === 'loading') {
        statusPanel.innerHTML = `<div class="spinner"></div><span>${message}</span>`;
      } else if (type === 'success') {
        statusPanel.innerHTML = `<i data-lucide="check-circle-2" style="width:14px;height:14px;color:#4ade80;"></i><span>${message}</span>`;
      } else {
        statusPanel.innerHTML = `<i data-lucide="alert-triangle" style="width:14px;height:14px;color:#f87171;"></i><span>${message}</span>`;
      }
      lucide.createIcons();
    }

    function renderFootprint(featureCollection, styleOptions, popupCallback) {
      const layer = L.geoJSON(featureCollection, {
        style: styleOptions,
        onEachFeature: (feature, layer) => {
          if (popupCallback) {
            layer.bindPopup(popupCallback(feature), { className: 'custom-popup' });
          }
        }
      });
      
      footprintsLayer.addLayer(layer);
      map.fitBounds(layer.getBounds(), { padding: [50, 50] });
    }

    // 1. Optical Imagery (Sentinel-2 STAC API)
    async function fetchOpticalImagery() {
      setStatus('loading', 'Querying Element84 STAC for Sentinel-2...');
      const payload = {
        "collections": ["sentinel-2-l2a"],
        "bbox": [73.7, 18.4, 74.0, 18.7],
        "limit": 3
      };

      try {
        const response = await fetch('https://earth-search.aws.element84.com/v1/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('STAC API returned an error');
        const stacData = await response.json();
        const count = stacData.features ? stacData.features.length : 0;

        renderFootprint(stacData, {
          color: '#10b981', weight: 3, opacity: 0.8, fillColor: '#10b981', fillOpacity: 0.2, dashArray: '5, 5'
        }, (f) => `
          <div style="padding:4px;">
            <strong style="color:#10b981;font-family:'Outfit',sans-serif;font-size:1rem;">Optical (Sentinel-2 L2A)</strong>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">Scene ID: ${f.id}</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Date: ${f.properties.datetime}</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Cloud Cover: ${f.properties['eo:cloud_cover']}%</div>
          </div>
        `);

        setStatus('success', `Found ${count} Sentinel-2 scenes.`);
      } catch (error) {
        console.error("Optical STAC error:", error);
        setStatus('error', "Failed to fetch Optical STAC data.");
      }
    }

    // 2. Radar/SAR (Sentinel-1 Mock)
    function fetchRadarImagery() {
      setStatus('loading', 'Querying ASF STAC for Sentinel-1 SAR...');
      setTimeout(() => {
        const sarGeoJSON = {
          "type": "FeatureCollection",
          "features": [{
            "type": "Feature",
            "id": "S1A_IW_GRDH_1SDV_20261009_PUNE_SAR",
            "properties": { "platform": "Sentinel-1A", "sensorMode": "IW", "polarization": "VV+VH", "date": "2026-10-09" },
            "geometry": { "type": "Polygon", "coordinates": [[[73.6, 18.3], [74.1, 18.3], [74.1, 18.8], [73.6, 18.8], [73.6, 18.3]]] }
          }]
        };

        renderFootprint(sarGeoJSON, {
          color: '#f43f5e', weight: 3, opacity: 0.8, fillColor: '#f43f5e', fillOpacity: 0.2
        }, (f) => `
          <div style="padding:4px;">
            <strong style="color:#f43f5e;font-family:'Outfit',sans-serif;font-size:1rem;">Radar SAR (Sentinel-1A)</strong>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">Scene ID: ${f.id}</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Mode: ${f.properties.sensorMode} (${f.properties.polarization})</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Acquired: ${f.properties.date}</div>
          </div>
        `);

        setStatus('success', `Found 1 Sentinel-1 SAR scene footprint.`);
      }, 600); // Simulate network delay
    }

    // 3. Elevation (COP30 DEM)
    function fetchElevationDEM() {
      setStatus('loading', 'Querying OpenTopography for Global DEM...');
      setTimeout(() => {
        const demGeoJSON = {
          "type": "FeatureCollection",
          "features": [{
            "type": "Feature",
            "id": "COP30_DEM_PUNE_TILE",
            "properties": { "provider": "OpenTopography", "dataset": "Copernicus DEM GLO-30", "resolution": "30m" },
            "geometry": { "type": "Polygon", "coordinates": [[[73.75, 18.45], [73.95, 18.45], [73.95, 18.60], [73.75, 18.60], [73.75, 18.45]]] }
          }]
        };

        renderFootprint(demGeoJSON, {
          color: '#eab308', weight: 4, opacity: 0.9, fillColor: '#ca8a04', fillOpacity: 0.25, dashArray: '10, 10'
        }, (f) => `
          <div style="padding:4px;">
            <strong style="color:#eab308;font-family:'Outfit',sans-serif;font-size:1rem;">Elevation 3D (DEM)</strong>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">Dataset: ${f.properties.dataset}</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Resolution: ${f.properties.resolution}</div>
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Provider: ${f.properties.provider}</div>
          </div>
        `);

        setStatus('success', `Found DEM 3D Elevation tile footprint.`);
      }, 800);
    }

    // Event Listeners
    document.getElementById('btn-optical').addEventListener('click', fetchOpticalImagery);
    document.getElementById('btn-radar').addEventListener('click', fetchRadarImagery);
    document.getElementById('btn-elevation').addEventListener('click', fetchElevationDEM);
    
    document.getElementById('btn-clear').addEventListener('click', () => {
      footprintsLayer.clearLayers();
      document.getElementById('status-panel').classList.add('hidden');
    });

    // Run on page load
    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
