<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pune GIS Spatial Engine - Buffer Analysis</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Turf.js for Spatial Math (Client-side simulation of Shapely) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    
    header {
      height: 64px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000;
    }
    .brand-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: #10b981; }
    
    .app-container { flex: 1; display: flex; position: relative; }
    #map { flex: 1; height: 100%; width: 100%; z-index: 1; background: #e5e3df; }
    
    .sidebar {
      position: absolute; top: 16px; left: 16px; width: 380px; max-height: calc(100% - 32px);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
      padding: 20px; display: flex; flex-direction: column; gap: 16px;
      z-index: 999; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); overflow-y: auto;
    }
    
    .btn-action {
      border: none; background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.9rem;
    }
    .btn-action:hover { box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transform: translateY(-1px); }
    
    .status-panel { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .custom-popup .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 8px; }
    .custom-popup .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
    
    .legend {
      position: absolute; bottom: 20px; right: 20px; z-index: 999;
      background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem; display: flex; flex-direction: column; gap: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 14px; height: 14px; border-radius: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">GIS Spatial Engine Integration</div>
    <div style="font-size: 0.8rem; color: #94a3b8;">Query: "Buildings within 200m of Pune Hospitals"</div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      <div style="font-family:'Outfit'; font-size: 1.1rem; font-weight: 600;">Spatial Analysis Execution</div>
      <p style="font-size: 0.8rem; color: #94a3b8;">
        Demonstrates the handoff from Retrieval -> Vision -> GIS using exact topological math.
      </p>
      
      <button id="btn-run" class="btn-action">
        <i data-lucide="play-circle"></i>
        <span>Run E2E Spatial Pipeline</span>
      </button>

      <div id="status" class="status-panel"></div>
    </div>
    
    <div id="map"></div>
    
    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background:#f472b6;"></div> Hospital (Vision Polygon)</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(59, 130, 246, 0.2); border: 2px dashed #3b82f6;"></div> 200m GIS Buffer Zone</div>
      <div class="legend-item"><div class="legend-color" style="background:#10b981;"></div> Building (Inside Buffer)</div>
      <div class="legend-item"><div class="legend-color" style="background:#64748b;"></div> Building (Outside Buffer)</div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let map = L.map('map', { zoomControl: false }).setView([18.528, 73.875], 16);
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let layerGroup = L.featureGroup().addTo(map);

    // Sleep helper
    const delay = ms => new Promise(res => setTimeout(res, ms));

    document.getElementById('btn-run').addEventListener('click', async () => {
      const statusDiv = document.getElementById('status');
      layerGroup.clearLayers();
      statusDiv.innerHTML = '';

      // 1. Data Retrieval + Vision
      statusDiv.innerHTML += `<div style="color:#a78bfa"><i data-lucide="eye" style="width:14px;"></i> Vision: Drawing exact hospital boundaries...</div>`;
      lucide.createIcons();
      
      // Mock Hospital Polygon (Ruby Hall area)
      const hospitalCoords = [
        [73.878, 18.532], [73.879, 18.532], [73.8795, 18.533], [73.8785, 18.5335], [73.878, 18.532]
      ];
      const hospitalGeoJSON = turf.polygon([hospitalCoords], { name: 'Hospital Boundary' });
      
      L.geoJSON(hospitalGeoJSON, {
        style: { color: '#f472b6', weight: 2, fillColor: '#f472b6', fillOpacity: 0.6 },
        onEachFeature: (f, l) => l.bindPopup(`<strong style="color:#f472b6">Target Hospital</strong>`, {className:'custom-popup'})
      }).addTo(layerGroup);
      
      map.fitBounds(layerGroup.getBounds(), { padding: [50, 50] });
      await delay(1500);

      // 2. GIS Engine - Buffer
      statusDiv.innerHTML += `<div style="color:#3b82f6"><i data-lucide="ruler" style="width:14px;"></i> GIS: Calculating 200m buffer zone (EPSG:3857 math)...</div>`;
      lucide.createIcons();
      
      // Turf.js buffer calculation (simulates shapely buffer in meters)
      const bufferZone = turf.buffer(hospitalGeoJSON, 200, { units: 'meters' });
      
      L.geoJSON(bufferZone, {
        style: { color: '#3b82f6', weight: 2, dashArray: '5, 5', fillColor: '#3b82f6', fillOpacity: 0.15 }
      }).addTo(layerGroup);
      
      map.fitBounds(layerGroup.getBounds(), { padding: [20, 20] });
      await delay(1500);

      // 3. GIS Engine - Spatial Intersection
      statusDiv.innerHTML += `<div style="color:#4ade80"><i data-lucide="map-pin" style="width:14px;"></i> GIS: Evaluating building intersections...</div>`;
      lucide.createIcons();

      // Mock Buildings around the area
      const buildings = [
        // Inside buffer
        turf.polygon([[[73.877, 18.532], [73.8775, 18.532], [73.8775, 18.5325], [73.877, 18.5325], [73.877, 18.532]]]),
        turf.polygon([[[73.879, 18.531], [73.8795, 18.531], [73.8795, 18.5315], [73.879, 18.5315], [73.879, 18.531]]]),
        // Boundary touching / partially inside
        turf.polygon([[[73.876, 18.533], [73.8765, 18.533], [73.8765, 18.534], [73.876, 18.534], [73.876, 18.533]]]),
        // Outside buffer
        turf.polygon([[[73.874, 18.530], [73.8745, 18.530], [73.8745, 18.5305], [73.874, 18.5305], [73.874, 18.530]]]),
        turf.polygon([[[73.881, 18.534], [73.8815, 18.534], [73.8815, 18.5345], [73.881, 18.5345], [73.881, 18.534]]])
      ];

      let matchCount = 0;
      
      buildings.forEach(bldg => {
        // Spatial intersection math (Shapely intersects equivalent)
        const isIntersecting = turf.booleanIntersects(bldg, bufferZone);
        
        if (isIntersecting) {
            matchCount++;
            L.geoJSON(bldg, {
                style: { color: '#10b981', weight: 2, fillColor: '#10b981', fillOpacity: 0.8 },
                onEachFeature: (f, l) => l.bindPopup(`<strong style="color:#10b981">Within 200m</strong>`, {className:'custom-popup'})
            }).addTo(layerGroup);
        } else {
            L.geoJSON(bldg, {
                style: { color: '#64748b', weight: 1, fillColor: '#64748b', fillOpacity: 0.4 },
                onEachFeature: (f, l) => l.bindPopup(`<strong style="color:#94a3b8">Outside Buffer</strong>`, {className:'custom-popup'})
            }).addTo(layerGroup);
        }
      });
      
      statusDiv.innerHTML += `<div style="color:#f8fafc; font-weight:600; margin-top:8px;">✅ Found ${matchCount} buildings within 200m!</div>`;
    });
  </script>
</body>
</html>
