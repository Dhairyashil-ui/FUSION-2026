<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pune Administrative Boundaries - Google 2D Map</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      height: 64px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #4285f4, #ea4335);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-google {
      background: rgba(66, 133, 244, 0.15);
      border: 1px solid rgba(66, 133, 244, 0.4);
      color: #60a5fa;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-google .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4285f4;
      box-shadow: 0 0 8px #4285f4;
    }

    /* Layout Main */
    .app-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Map View */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #e5e3df;
      z-index: 1;
    }

    /* Floating Overlay Sidebar */
    .sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      max-height: calc(100% - 32px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 999;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Search Box */
    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.25);
    }

    .btn-search {
      background: linear-gradient(135deg, #4285f4, #1a73e8);
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
    }

    .btn-search:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(26, 115, 232, 0.5);
    }

    /* Preset Quick Buttons */
    .presets-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover, .preset-btn.active {
      background: rgba(66, 133, 244, 0.25);
      border-color: #4285f4;
      color: #60a5fa;
    }

    /* Status Loader */
    .status-panel {
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-panel.loading {
      color: #60a5fa;
      border-color: rgba(66, 133, 244, 0.3);
    }

    .status-panel.success {
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.3);
    }

    .status-panel.error {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(66, 133, 244, 0.3);
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Info Cards */
    .info-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      color: #f1f5f9;
      font-weight: 600;
      text-align: right;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Action Buttons Bar */
    .action-bar {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: #4285f4;
      color: #60a5fa;
    }

    /* Map Layer Control Style */
    .leaflet-control-layers {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      color: #f8fafc !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
      padding: 8px 12px !important;
      font-family: inherit;
    }

    /* Popup Styling */
    .custom-popup .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(66, 133, 244, 0.5);
      color: #f8fafc;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .custom-popup .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.95);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="map-pin"></i>
      </div>
      <div>
        <div class="brand-title">Pune Administrative Boundaries</div>
        <div class="brand-subtitle">Google Real 2D Map + Smart Fallback Boundary API</div>
      </div>
    </div>

    <div class="header-actions">
      <div class="badge-google">
        <div class="dot"></div>
        <span>Google Real 2D Map Live</span>
      </div>
    </div>
  </header>

  <!-- App Main Container -->
  <div class="app-container">

    <!-- Floating Sidebar Panel -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <i data-lucide="search"></i>
          <span>Boundary Search</span>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-box">
        <input
          type="text"
          id="query-input"
          class="search-input"
          value="Pimpri-Chinchwad, Maharashtra"
          placeholder="Enter region or city..."
        />
        <button id="btn-search" class="btn-search">
          <i data-lucide="arrow-right"></i>
        </button>
      </div>

      <!-- Quick Presets -->
      <div>
        <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500;">QUICK PRESETS</div>
        <div class="presets-container">
          <button class="preset-btn active" onclick="loadBoundary('Pimpri-Chinchwad, Maharashtra')">Pimpri-Chinchwad</button>
          <button class="preset-btn" onclick="loadBoundary('Pune District, Maharashtra')">Pune District</button>
          <button class="preset-btn" onclick="loadBoundary('Pune, Maharashtra')">Pune City</button>
          <button class="preset-btn" onclick="loadBoundary('Haveli, Pune, Maharashtra')">Haveli Taluka</button>
        </div>
      </div>

      <!-- Status Indicator -->
      <div id="status-panel" class="status-panel loading">
        <div class="spinner"></div>
        <span id="status-text">Fetching boundary data...</span>
      </div>

      <!-- Info Details Card -->
      <div class="info-card">
        <div style="font-size: 0.8rem; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: 0.5px;">Boundary Metadata</div>

        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value" id="meta-name">-</span>
        </div>

        <div class="info-row">
          <span class="info-label">Boundary Class</span>
          <span class="info-value" id="meta-class">-</span>
        </div>

        <div class="info-row">
          <span class="info-label">OSM ID / Type</span>
          <span class="info-value" id="meta-osmid">-</span>
        </div>

        <div class="info-row">
          <span class="info-label">Geometry Type</span>
          <span class="info-value" id="meta-geomtype">-</span>
        </div>

        <div class="info-row">
          <span class="info-label">Polygon Vertices</span>
          <span class="info-value" id="meta-vertices">-</span>
        </div>

        <div class="info-row">
          <span class="info-label">Bounding Box</span>
          <span class="info-value" id="meta-bbox" style="font-size: 0.7rem;">-</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-bar">
        <button class="btn-action" onclick="zoomToBoundary()">
          <i data-lucide="maximize"></i>
          <span>Zoom to Fit</span>
        </button>
        <button class="btn-action" onclick="copyGeoJSON()">
          <i data-lucide="copy"></i>
          <span>Copy GeoJSON</span>
        </button>
        <button class="btn-action" onclick="downloadGeoJSON()">
          <i data-lucide="download"></i>
          <span>Export</span>
        </button>
      </div>
    </div>

    <!-- Map View Element -->
    <div id="map"></div>
  </div>

  <!-- JavaScript logic -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Map & Layer State Variables
    let map = null;
    let geojsonLayer = null;
    let currentGeoJSON = null;

    // GOOGLE MAPS TILE LAYERS (Real Google 2D Map)
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    // Initialize Leaflet Map with Google Maps 2D Roadmap
    function initMap() {
      map = L.map('map', {
        center: [18.6298, 73.7997], // Pimpri-Chinchwad default coordinates
        zoom: 11,
        layers: [googleRoadmap],
        zoomControl: false
      });

      // Add Zoom Control to bottom right
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Layer Control with Google Maps 2D Layers
      const baseMaps = {
        "Google 2D Map (Roadmap)": googleRoadmap,
        "Google Hybrid (Satellite + Roads)": googleHybrid,
        "Google Satellite": googleSatellite,
        "Google Terrain 2D": googleTerrain
      };
      L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

      // Load initial boundary for Pimpri-Chinchwad
      loadBoundary("Pimpri-Chinchwad, Maharashtra");
    }

    // Set UI Status
    function setStatus(type, message) {
      const statusPanel = document.getElementById('status-panel');
      statusPanel.className = `status-panel ${type}`;
      if (type === 'loading') {
        statusPanel.innerHTML = `<div class="spinner"></div><span>${message}</span>`;
      } else if (type === 'success') {
        statusPanel.innerHTML = `<i data-lucide="check-circle-2" style="width:14px;height:14px;color:#4ade80;"></i><span>${message}</span>`;
        lucide.createIcons();
      } else {
        statusPanel.innerHTML = `<i data-lucide="alert-triangle" style="width:14px;height:14px;color:#f87171;"></i><span>${message}</span>`;
        lucide.createIcons();
      }
    }

    // Count Polygon Vertices
    function countVertices(geom) {
      if (!geom || !geom.coordinates) return 0;
      let count = 0;
      function recurse(coords) {
        if (typeof coords[0] === 'number') {
          count++;
        } else {
          coords.forEach(c => recurse(c));
        }
      }
      recurse(geom.coordinates);
      return count;
    }

    // Smart Multi-Strategy Boundary Fetching
    async function fetchBoundaryGeoJSON(queryStr) {
      const cleanQ = queryStr.split(',')[0].trim();
      const candidates = [
        queryStr,
        `${cleanQ} Municipal Corporation`,
        `${cleanQ} Municipal Corporation, Maharashtra`,
        `${cleanQ} City`,
        `${cleanQ} District, Maharashtra`,
        cleanQ
      ];

      for (const q of candidates) {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&q=${encodeURIComponent(q)}`;
          const response = await fetch(url);
          if (!response.ok) continue;
          const data = await response.json();
          if (!data || !data.features || data.features.length === 0) continue;

          // Look for explicit Polygon or MultiPolygon
          const polyFeat = data.features.find(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'));
          if (polyFeat) {
            return polyFeat;
          }

          // If only Point feature is found with boundingbox, construct a Box Polygon!
          const ptFeat = data.features.find(f => f.properties && f.properties.boundingbox);
          if (ptFeat) {
            const [s, n, w, e] = ptFeat.properties.boundingbox.map(Number);
            return {
              type: "Feature",
              properties: {
                ...ptFeat.properties,
                display_name: ptFeat.properties.display_name,
                is_bbox_fallback: true
              },
              geometry: {
                type: "Polygon",
                coordinates: [[
                  [w, s], [e, s], [e, n], [w, n], [w, s]
                ]]
              }
            };
          }
        } catch (err) {
          console.warn(`Query search notice for ${q}:`, err);
        }
      }
      throw new Error(`No boundary polygon found for "${queryStr}".`);
    }

    // Load Administrative Boundary
    async function loadBoundary(queryStr) {
      document.getElementById('query-input').value = queryStr;
      setStatus('loading', `Fetching boundary for "${queryStr}"...`);

      // Update active preset button state
      document.querySelectorAll('.preset-btn').forEach(btn => {
        if (btn.innerText.toLowerCase().includes(queryStr.split(',')[0].toLowerCase())) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      try {
        const feature = await fetchBoundaryGeoJSON(queryStr);
        currentGeoJSON = feature;

        // Render on Google 2D Map
        renderGeoJSONOnMap(feature);

        // Update Metadata sidebar
        const props = feature.properties || {};
        document.getElementById('meta-name').innerText = props.display_name ? props.display_name.split(',')[0] : queryStr;
        document.getElementById('meta-class').innerText = `${props.class || 'boundary'} / ${props.type || 'administrative'}`;
        document.getElementById('meta-osmid').innerText = `${props.osm_type || 'relation'}: ${props.osm_id || 'N/A'}`;
        document.getElementById('meta-geomtype').innerText = feature.geometry.type;
        document.getElementById('meta-vertices').innerText = `${countVertices(feature.geometry).toLocaleString()} points`;

        if (props.boundingbox) {
          const bboxStr = props.boundingbox.map(n => parseFloat(n).toFixed(3)).join(', ');
          document.getElementById('meta-bbox').innerText = `[${bboxStr}]`;
        } else {
          document.getElementById('meta-bbox').innerText = 'N/A';
        }

        setStatus('success', `Loaded ${feature.geometry.type} boundary for ${props.display_name ? props.display_name.split(',')[0] : queryStr}`);

      } catch (err) {
        console.error("Boundary fetch error:", err);
        setStatus('error', err.message || "Failed to fetch boundary.");
      }
    }

    // Render Polygon on Google 2D Map
    function renderGeoJSONOnMap(feature) {
      if (geojsonLayer) {
        map.removeLayer(geojsonLayer);
      }

      // High-contrast Google-styled vector polygon
      geojsonLayer = L.geoJSON(feature, {
        style: {
          color: '#1a73e8',
          weight: 4,
          opacity: 0.95,
          fillColor: '#4285f4',
          fillOpacity: 0.25
        },
        onEachFeature: (feat, layer) => {
          const name = feat.properties.display_name || "Administrative Area";
          layer.bindPopup(`
            <div class="custom-popup" style="padding: 6px;">
              <strong style="font-family:'Outfit',sans-serif;font-size:1rem;color:#4285f4;">${name.split(',')[0]}</strong>
              <div style="font-size:0.8rem;color:#cbd5e1;margin-top:4px;">${name}</div>
              <div style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">Type: <strong>${feat.geometry.type}</strong></div>
            </div>
          `, { className: 'custom-popup' });

          // Hover highlight effects
          layer.on('mouseover', () => {
            layer.setStyle({
              color: '#d93025',
              weight: 5,
              fillOpacity: 0.4
            });
          });

          layer.on('mouseout', () => {
            layer.setStyle({
              color: '#1a73e8',
              weight: 4,
              fillOpacity: 0.25
            });
          });
        }
      }).addTo(map);

      // Fit map bounds to polygon
      map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40] });
    }

    // Zoom to polygon bounds
    function zoomToBoundary() {
      if (geojsonLayer) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40] });
      }
    }

    // Copy GeoJSON to Clipboard
    function copyGeoJSON() {
      if (!currentGeoJSON) return;
      navigator.clipboard.writeText(JSON.stringify(currentGeoJSON, null, 2))
        .then(() => alert("GeoJSON copied to clipboard!"))
        .catch(err => alert("Copy failed: " + err));
    }

    // Download GeoJSON file
    function downloadGeoJSON() {
      if (!currentGeoJSON) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentGeoJSON, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      const name = (currentGeoJSON.properties?.display_name || "pimpri_chinchwad_boundary").split(',')[0].toLowerCase().replace(/\s+/g, '_');
      downloadAnchor.setAttribute("download", `${name}_boundary.geojson`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Search button listener
    document.getElementById('btn-search').addEventListener('click', () => {
      const q = document.getElementById('query-input').value.trim();
      if (q) loadBoundary(q);
    });

    document.getElementById('query-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const q = document.getElementById('query-input').value.trim();
        if (q) loadBoundary(q);
      }
    });

    // Run on page load
    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
